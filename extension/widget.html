<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾词收藏与设置</title><link rel="stylesheet" href="widget.css"></head>
<body>
  <header><div class="brand"><span>拾</span><div>拾词<small>阅读不停，随手查看</small></div></div><button id="close" class="icon" aria-label="收起拾词浮框">×</button></header>
  <nav aria-label="浮框页面"><button id="favorites-tab" class="selected" aria-selected="true">收藏 <span id="count">0</span></button><button id="settings-tab" aria-selected="false">设置</button></nav>
  <p id="feedback" role="status" hidden></p>
  <section id="favorites-view"><input type="search" id="search" aria-label="搜索收藏单词" placeholder="搜索英文或中文释义…"><div id="favorites"></div><button id="more" hidden>继续显示</button><button id="open-book" class="wide">打开完整单词本 ↗</button></section>
  <section id="settings-view" hidden>
    <div class="setting"><h2>查词快捷键</h2><div class="shortcut"><kbd id="shortcut">读取中…</kbd><button id="shortcuts">修改快捷键 ↗</button></div><p>在 Edge 的扩展快捷键页面修改；返回后这里会显示当前绑定。</p></div>
    <div class="setting"><h2>圆形图标</h2><label>图标大小<select id="size"><option value="40">小 · 40 px</option><option value="48">标准 · 48 px</option><option value="56">大 · 56 px</option></select></label><label>透明度 <output id="opacity-value">90%</output><input type="range" id="opacity" min="40" max="100" step="5" value="90"></label><button id="reset-position" class="wide">重置到右侧</button><p>拖动圆形图标调整位置，松开后自动记住。点击页面空白或按 Escape 可收起浮框。</p></div>
    <div class="setting"><h2>查词偏好</h2><label class="toggle">启用主动 AI 解释<input type="checkbox" id="ai-enabled"></label><p id="ai-status"></p><button id="open-settings" class="wide">API、备份与完整设置 ↗</button><button id="hide-widget" class="wide subtle">隐藏网页图标</button><p>隐藏后，可点击浏览器工具栏的拾词图标，在设置中重新显示。</p></div>
  </section>
  <footer>仅主动查词 · 本地保存</footer>
  <script type="module" src="widget.js"></script>
</body></html>
